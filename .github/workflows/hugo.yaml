# Main repository workflow. Runs only after this project is pushed to GitHub.
# Configure the repository Pages source and final domain at connection time.
name: Publish Hugo blog
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.154.5
      TZ: Africa/Cairo
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v6
      - name: Install pinned Hugo Extended
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/hugo"
          curl --fail --location --retry 3 \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
            --output "${RUNNER_TEMP}/hugo.tar.gz"
          tar -xzf "${RUNNER_TEMP}/hugo.tar.gz" -C "${RUNNER_TEMP}/hugo"
          echo "${RUNNER_TEMP}/hugo" >> "${GITHUB_PATH}"
      - name: Build public website
        env:
          HUGO_ENVIRONMENT: production
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: hugo --gc --minify --baseURL "${PAGES_BASE_URL%/}/"
      - name: Check generated pages and links
        run: python3 scripts/verify.py public
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to Pages
        id: deployment
        uses: actions/deploy-pages@v5
