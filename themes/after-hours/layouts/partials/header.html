<header class="site-header" id="top">
  <div class="header-inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="0xStrawHat home">{{ partial "hat.html" . }}<span>0xStrawHat<span class="brand-dot">.</span></span></a>
    <nav class="desktop-nav" aria-label="Main navigation">
      <a href="{{ site.Home.RelPermalink }}" {{ if .IsHome }}aria-current="page"{{ end }}>Home</a>
      <a href="{{ "post/" | relURL }}" {{ if eq .Section "post" }}aria-current="page"{{ end }}>Logbook</a>
      <a href="{{ "archives/" | relURL }}" {{ if eq .Section "archives" }}aria-current="page"{{ end }}>Archives</a>
      <a href="{{ "cves/" | relURL }}" {{ if eq .Section "cves" }}aria-current="page"{{ end }}>CVEs</a>
      
      <a href="{{ "about/" | relURL }}" {{ if eq .RelPermalink ("about/" | relURL) }}aria-current="page"{{ end }}>About</a>
      
    </nav>
    <div class="header-actions">
      <a class="search-trigger icon-button" href="{{ "search/" | relURL }}" aria-label="Search the logbook">{{ partial "icon.html" "search" }}<kbd>/</kbd></a>
      <button disabled data-enhance class="icon-button theme-toggle js-only" type="button" aria-label="Switch to light theme">{{ partial "icon.html" "sun" }}</button>
      <details class="mobile-menu"><summary aria-label="Open navigation">{{ partial "icon.html" "menu" }}</summary><nav aria-label="Mobile navigation"><a href="{{ site.Home.RelPermalink }}">Home</a><a href="{{ "post/" | relURL }}">Logbook</a><a href="{{ "archives/" | relURL }}">Archives</a><a href="{{ "cves/" | relURL }}">CVEs</a><a href="{{ "about/" | relURL }}">About</a></nav></details>
    </div>
  </div>
</header>
