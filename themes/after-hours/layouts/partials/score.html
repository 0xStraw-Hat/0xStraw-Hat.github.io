{{ if isset . "score" }}<span class="score score-{{ .severity | lower }}" title="CVSS {{ .cvss_version }} · {{ .severity }}"><span class="sr-only">CVSS {{ .cvss_version }} score </span>{{ printf "%.1f" (float .score) }}<span class="sr-only">, {{ .severity }}</span></span>{{ else }}<span class="score score-{{ .severity | default "unrated" | lower }}" title="{{ .severity | default "Unrated" }} · No published numeric CVSS score">{{ .severity | default "—" }}<span class="sr-only">, no published numeric CVSS score</span></span>{{ end }}
